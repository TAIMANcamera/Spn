<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Spin The Bottle</title>

<link href="static/css/main.a32329e6.css" rel="stylesheet">

<script>

/* LOGIN BYPASS + FORCE APP */

localStorage.setItem("token","taiman");
localStorage.setItem("auth","true");
localStorage.setItem("isAuthenticated","true");

window.addEventListener("load",()=>{

setTimeout(()=>{

const loader=document.getElementById("app-loader");

if(loader){
loader.style.display="none";
}

},1500);

});

</script>

<style>

html,
body{
margin:0;
padding:0;
width:100%;
height:100%;
background:#0b0b0c;
overflow:hidden;
}

#root{
width:100%;
height:100%;
}

#app-loader{
position:fixed;
inset:0;
background:#0b0b0c;
display:flex;
align-items:center;
justify-content:center;
z-index:999999;
}

.spinner{
width:60px;
height:60px;
border:4px solid #ffffff30;
border-top:4px solid #fff;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

</style>

</head>

<body>

<!-- ONLY ROOT -->
<div id="root"></div>

<!-- LOADER -->
<div id="app-loader">
<div class="spinner"></div>
</div>

<!-- IMPORTANT -->
<script defer src="static/js/main.be3d9225.js"></script>

</body>
</html>
